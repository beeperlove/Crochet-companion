<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7efe3"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Crochet Companion</title><style> *{box-sizing:border-box}body{margin:auto;max-width:660px;padding:24px 16px 60px;background:#f7efe3;color:#39493c;font:17px system-ui}h1,h2{font-family:Georgia,serif}h1{font-size:32px}h2{font-size:22px}section{background:#fffaf3;border:1px solid #dfd5c8;border-radius:22px;padding:18px;margin:16px 0}button,input,select{font:inherit;border:1px solid #a7b3a0;border-radius:12px;padding:12px;background:#fffaf3;color:inherit}button{cursor:pointer;min-height:46px}button.primary{background:#526d52;color:white}button.active{background:#e8b9bf;border:2px solid #82565d}button.done{background:#dce7d4}button:disabled{opacity:.45}button.wide{width:100%}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.flex button{flex:1}small,p{line-height:1.5}small{color:#667164}.big{font: bold 64px Georgia}.groups{display:flex;flex-wrap:wrap;gap:8px}.groups button{min-width:57px}.groups .dc{border-bottom:4px solid #b77780}.groups .sc{border-bottom:4px solid #7f9d85}input[type=number]{width:90px}input[type=color]{padding:3px;width:48px;height:44px}progress{width:100%;accent-color:#627e60}header{border-bottom:1px solid #d9cdbd;padding-bottom:12px}#status{font-size:13px} </style></head><body><header><small>YOUR LITTLE MAKER SPACE</small><h1>🧶 Crochet Companion</h1><div id="status">Progress saved on this device</div></header><main id="app"></main><input id="file" type="file" accept=".json,application/json" hidden><script>
const key='crochet-companion-v1';let db={projects:[],current:null};try{db=JSON.parse(localStorage.getItem(key))||db}catch{};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(db));$('#status').textContent='✓ Progress saved on this device'}catch{$('#status').textContent='Storage unavailable — export a backup'}}function commit(){save();render()}function rows(p){return Object.keys(p.pattern).map(Number).sort((a,b)=>a-b)}function current(){return db.projects.find(p=>p.id===db.current)}function openProject(id){db.current=id;commit()}function home(){db.current=null;commit()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='crochet-companion-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function valid(p){return p&&typeof p.name==='string'&&p.pattern&&Object.keys(p.pattern).length&&Object.keys(p.pattern).every(k=>/^\d+$/.test(k)&&Array.isArray(p.pattern[k].groups)&&p.pattern[k].groups.every(g=>typeof g==='string'))}function normalize(p){let r=rows(p);return {...p,id:String(p.id||Date.now()+Math.random()),row:r.includes(+p.row)?+p.row:r[0],total:Math.max(1,Math.min(30,+p.total||7)),repeat:Math.max(1,Math.min(+p.total||7,+p.repeat||1)),group:Math.max(0,+p.group||0),cycle:Math.max(1,+p.cycle||1),colors:p.colors||{A:'#82977a',B:'#d9a1a8',C:'#ead5a4'}}}$('#file').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());let ps=data.projects||[data];if(!Array.isArray(ps)||!ps.length||!ps.every(valid))throw Error();for(let p of ps.map(normalize)){let i=db.projects.findIndex(x=>x.id===p.id);if(i>=0){if(confirm('Replace saved project '+p.name+'?'))db.projects[i]=p}else db.projects.push(p)}db.current=null;commit()}catch{alert('Could not import this project. Choose a Crochet Companion JSON file.')}e.target.value=''};function shift(n){let p=current(),r=rows(p),i=r.indexOf(p.row)+n;if(i<0||i>=r.length)return;p.row=r[i];p.repeat=1;p.group=0;commit()}function setRepeat(n){let p=current();p.repeat=n;p.group=0;commit()}function group(i){let p=current();p.group=p.group===i+1?i:i+1;commit()}function jump(){let p=current(),n=+$('#jump').value;if(!rows(p).includes(n))return alert('Choose an available row');p.row=n;p.repeat=1;p.group=0;commit()}function cycle(){let p=current();p.cycle=Math.max(1,+$('#cycle').value||1);commit()}function render(){let p=current();if(!p){$('#app').innerHTML=`<h2>My projects</h2>${db.projects.map((p,i)=>`<section><h2>${esc(p.name)}</h2><small>${esc(p.designer)} · Row ${p.row} · Repeat ${p.repeat}/${p.total}</small><p><progress max="${rows(p).length}" value="${rows(p).indexOf(p.row)}"></progress></p><button class="primary wide" onclick="openProject(db.projects[${i}].id)">Continue crocheting →</button></section>`).join('')||'<section>Your project basket is empty. Import your Ancient Stories project to get started.</section>'}<section><button class="wide primary" onclick="$('#file').click()">＋ Import project / backup</button><p><small>Choose a project JSON file prepared from your pattern.</small></p><button class="wide" onclick="exportData()">Export all projects & progress</button></section>`;return}let r=rows(p),d=p.pattern[p.row],next=p.pattern[r[r.indexOf(p.row)+1]],g=d.groups;p.group=Math.min(g.length,p.group);$('#app').innerHTML=`<p><button onclick="home()">← My projects</button></p><h2>${esc(p.name)}</h2><section><small>CURRENT ROW · PATTERN PASS ${p.cycle}</small><div class="big">${p.row}</div><p>🧶 <strong>Color ${esc(d.color)}</strong> <span style="display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:middle;background:${/^#[0-9a-f]{6}$/i.test(p.colors[d.color])?p.colors[d.color]:'#ccc'}"></span> ${next?' · Next: '+esc(next.color):' · Last loaded row'}</p><div class="flex"><button onclick="shift(-1)" ${p.row===r[0]?'disabled':''}>← Previous</button><button class="primary" onclick="shift(1)" ${p.row===r.at(-1)?'disabled':''}>Finish row →</button></div></section><section><h2>Start of row</h2>${esc(d.start)}<h2>Repeat ${p.repeat} of ${p.total}</h2><div class="groups">${Array.from({length:p.total},(_,i)=>`<button class="${i+1===p.repeat?'active':i+1<p.repeat?'done':''}" onclick="setRepeat(${i+1})">${i+1}</button>`).join('')}</div><h2>Stitch groups</h2><small>Tap a group when finished. Pink marks the next group.</small><p class="groups">${g.map((x,i)=>`<button class="${i<p.group?'done':i===p.group?'active':''} ${x.endsWith('dc')?'dc':'sc'}" onclick="group(${i})">${i<p.group?'✓ ':''}${esc(x)}</button>`).join('')||'Work across as instructed.'}</p><div class="flex"><button onclick="group(Math.max(0,current().group-1))" ${!p.group?'disabled':''}>Undo group</button><button class="primary" onclick="setRepeat(${p.repeat+1})" ${p.repeat===p.total?'disabled':''}>Next repeat →</button></div><h2>End of row</h2>${esc(d.end)}</section><section><details><summary>Written row instructions</summary><p>${esc(d.text).replace(/x 7\b/g,'x '+p.total)}</p></details><p><small>${esc(p.note||'Check against your original pattern.')}</small></p></section><section><h2>Project settings</h2><p>Jump to row <input id="jump" type="number" value="${p.row}"><button onclick="jump()">Go</button></p><p>Repeats across <input type="number" min="1" max="30" value="${p.total}" onchange="current().total=Math.max(1,Math.min(30,+this.value||1));current().repeat=Math.min(current().repeat,current().total);commit()"></p><p>Pattern pass <input id="cycle" type="number" min="1" value="${p.cycle}" onchange="cycle()"></p><div class="flex">${['A','B','C'].map(c=>`<label>Color ${c} <input type="color" value="${/^#[0-9a-f]{6}$/i.test(p.colors[c])?p.colors[c]:'#aaaaaa'}" onchange="current().colors.${c}=this.value;commit()"></label>`).join('')}</div><p><button onclick="if(confirm('Restart this row?')){setRepeat(1)}">Restart row</button> <button onclick="exportData()">Backup</button></p></section>`}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
